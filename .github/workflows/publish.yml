# Publishes the entry in registry/ to a Bazel registry, as a pull request.
#
# The module is an overlay over the upstream graphviz archive, so there is no
# release of this repository to publish: the entry is generated into registry/
# by //tools:make_entry and committed, and publishing is copying it into a
# registry. filmil/bazel-registry always; the Bazel Central Registry when
# asked, because that pull request is public and reviewed by its maintainers.
name: Publish the registry entry

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to publish, as in registry/modules/graphviz/<version>"
        required: true
        type: string
      bcr:
        description: "Also open a pull request against the Bazel Central Registry"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: "The entry exists and is current"
        run: |
          test -f "registry/modules/graphviz/${{ inputs.version }}/source.json"
          bazel run //tools:make_entry -- check
      - name: "Build the tool once, outside the steps that use it"
        run: bazel build //tools:make_entry

      - name: "Pull request to filmil/bazel-registry"
        env:
          GH_TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN }}
        run: |
          set -o errexit -o nounset -o pipefail
          version="${{ inputs.version }}"
          branch="graphviz-${version}"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/filmil/bazel-registry.git" /tmp/registry
          # A dispatch repeated for the same version finds the branch its
          # first run pushed. Carry on from that branch, so the push stays a
          # fast forward and the run ends by saying there is nothing to add.
          if git -C /tmp/registry fetch --depth 1 origin "${branch}"; then
            git -C /tmp/registry checkout -B "${branch}" FETCH_HEAD
          else
            git -C /tmp/registry checkout -B "${branch}"
          fi
          mkdir -p /tmp/registry/modules/graphviz
          cp -r "registry/modules/graphviz/${version}" /tmp/registry/modules/graphviz/
          # The version being published, and no other: a registry's
          # metadata.json may only name versions that registry holds.
          bazel run //tools:make_entry -- merge-metadata \
            "${PWD}/registry/modules/graphviz/metadata.json" \
            /tmp/registry/modules/graphviz/metadata.json "${version}"
          # The registry builds itself with Bazel, and must not load the
          # overlay's BUILD files as packages of its own: one .bazelignore
          # line per overlay, since Bazel expands no patterns in that file.
          ignore="modules/graphviz/${version}/overlay"
          grep -qxF "${ignore}" /tmp/registry/.bazelignore || echo "${ignore}" >> /tmp/registry/.bazelignore
          cd /tmp/registry
          # The commit is the maintainer's, not a bot's: the Bazel Central
          # Registry's CLA check wants a commit author who has signed it.
          git config user.name "$(jq -r '.maintainers[0].name' "${GITHUB_WORKSPACE}/upstream.json")"
          git config user.email "$(jq -r '.maintainers[0].email' "${GITHUB_WORKSPACE}/upstream.json")"
          git add modules/graphviz .bazelignore
          # A registry that already has this version, on its main branch or
          # on the branch above, needs nothing; the run goes on to the next
          # registry instead of failing here.
          if git diff --cached --quiet; then
            echo "graphviz ${version} is already in filmil/bazel-registry; nothing to publish"
            exit 0
          fi
          git commit -m "graphviz ${version}"
          git push -u origin "${branch}"
          if [ -n "$(gh pr list --repo filmil/bazel-registry --head "${branch}" \
              --state open --json number --jq '.[0].number')" ]; then
            echo "a pull request for ${branch} is already open; it now has this commit"
            exit 0
          fi
          gh pr create --repo filmil/bazel-registry --base main --head "${branch}" \
            --title "graphviz ${version}" \
            --body "Overlay module entry generated by https://github.com/filmil/bazel_graphviz at ${GITHUB_SHA}."

      - name: "Pull request to the Bazel Central Registry"
        if: ${{ inputs.bcr }}
        env:
          GH_TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN }}
        run: |
          set -o errexit -o nounset -o pipefail
          version="${{ inputs.version }}"
          branch="graphviz-${version}"
          gh repo sync filmil/bazel-central-registry --source bazelbuild/bazel-central-registry
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/filmil/bazel-central-registry.git" /tmp/bcr
          # As above: continue from the branch a previous run pushed.
          if git -C /tmp/bcr fetch --depth 1 origin "${branch}"; then
            git -C /tmp/bcr checkout -B "${branch}" FETCH_HEAD
          else
            git -C /tmp/bcr checkout -B "${branch}"
          fi
          mkdir -p /tmp/bcr/modules/graphviz
          cp -r "registry/modules/graphviz/${version}" /tmp/bcr/modules/graphviz/
          bazel run //tools:make_entry -- merge-metadata \
            "${PWD}/registry/modules/graphviz/metadata.json" \
            /tmp/bcr/modules/graphviz/metadata.json "${version}"
          cd /tmp/bcr
          # The commit is the maintainer's, not a bot's: the Bazel Central
          # Registry's CLA check wants a commit author who has signed it.
          git config user.name "$(jq -r '.maintainers[0].name' "${GITHUB_WORKSPACE}/upstream.json")"
          git config user.email "$(jq -r '.maintainers[0].email' "${GITHUB_WORKSPACE}/upstream.json")"
          git add modules/graphviz
          # A registry that already has this version, on its main branch or
          # on the branch above, needs nothing.
          if git diff --cached --quiet; then
            echo "graphviz ${version} is already in the Bazel Central Registry; nothing to publish"
            exit 0
          fi
          git commit -m "graphviz ${version}"
          git push -u origin "${branch}"
          if [ -n "$(gh pr list --repo bazelbuild/bazel-central-registry --head "filmil:${branch}" \
              --state open --json number --jq '.[0].number')" ]; then
            echo "a pull request for ${branch} is already open; it now has this commit"
            exit 0
          fi
          gh pr create --repo bazelbuild/bazel-central-registry --base main --head "filmil:${branch}" \
            --title "graphviz ${version}" \
            --body "$(printf '%s\n' \
              "Overlay module for graphviz: upstream's own release archive from gitlab.com/graphviz/graphviz, built with rules_cc alone (no rules_foreign_cc). Provides the library, the dot binary, and one binary per layout engine." \
              "" \
              "Maintained at https://github.com/filmil/bazel_graphviz, where the entry is generated and validated with tools/bcr_validation.py before it is published." \
              "" \
              "Fixes: https://github.com/bazelbuild/bazel-central-registry/issues/4599")"
