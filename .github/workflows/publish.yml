# Publishes the entry in registry/ to a Bazel registry, as a pull request.
#
# The module is an overlay over the upstream graphviz archive, so there is no
# release of this repository to publish: the entry is generated into registry/
# by tools/make_entry.py and committed, and publishing is copying it into a
# registry. filmil/bazel-registry always; the Bazel Central Registry when
# asked, because that pull request is public and reviewed by its maintainers.
name: Publish the registry entry

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to publish, as in registry/modules/graphviz/<version>"
        required: true
        type: string
      bcr:
        description: "Also open a pull request against the Bazel Central Registry"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: "Check the entry exists"
        run: test -f "registry/modules/graphviz/${{ inputs.version }}/source.json"

      - name: "Pull request to filmil/bazel-registry"
        env:
          GH_TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN }}
        run: |
          set -o errexit -o nounset -o pipefail
          version="${{ inputs.version }}"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/filmil/bazel-registry.git" /tmp/registry
          cd /tmp/registry
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "graphviz-${version}"
          mkdir -p modules/graphviz
          cp -r "${GITHUB_WORKSPACE}/registry/modules/graphviz/${version}" modules/graphviz/
          python3 - "${GITHUB_WORKSPACE}/registry/modules/graphviz/metadata.json" modules/graphviz/metadata.json <<'PY'
          import json, sys
          ours = json.load(open(sys.argv[1]))
          try:
              theirs = json.load(open(sys.argv[2]))
          except FileNotFoundError:
              theirs = {"versions": [], "yanked_versions": {}}
          for v in ours["versions"]:
              if v not in theirs["versions"]:
                  theirs["versions"].append(v)
          for k in ("homepage", "maintainers", "repository"):
              theirs[k] = ours[k]
          json.dump(theirs, open(sys.argv[2], "w"), indent=4)
          open(sys.argv[2], "a").write("\n")
          PY
          git add modules/graphviz
          git commit -m "graphviz ${version}"
          git push -u origin "graphviz-${version}"
          gh pr create --repo filmil/bazel-registry --base main --head "graphviz-${version}" \
            --title "graphviz ${version}" \
            --body "Overlay module entry generated by https://github.com/filmil/bazel_graphviz at ${GITHUB_SHA}."

      - name: "Pull request to the Bazel Central Registry"
        if: ${{ inputs.bcr }}
        env:
          GH_TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN }}
        run: |
          set -o errexit -o nounset -o pipefail
          version="${{ inputs.version }}"
          gh repo sync filmil/bazel-central-registry --source bazelbuild/bazel-central-registry
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/filmil/bazel-central-registry.git" /tmp/bcr
          cd /tmp/bcr
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "graphviz-${version}"
          mkdir -p modules/graphviz
          cp -r "${GITHUB_WORKSPACE}/registry/modules/graphviz/${version}" modules/graphviz/
          python3 - "${GITHUB_WORKSPACE}/registry/modules/graphviz/metadata.json" modules/graphviz/metadata.json <<'PY'
          import json, sys
          ours = json.load(open(sys.argv[1]))
          try:
              theirs = json.load(open(sys.argv[2]))
          except FileNotFoundError:
              theirs = {"versions": [], "yanked_versions": {}}
          for v in ours["versions"]:
              if v not in theirs["versions"]:
                  theirs["versions"].append(v)
          for k in ("homepage", "maintainers", "repository"):
              theirs[k] = ours[k]
          json.dump(theirs, open(sys.argv[2], "w"), indent=4)
          open(sys.argv[2], "a").write("\n")
          PY
          git add modules/graphviz
          git commit -m "graphviz ${version}"
          git push -u origin "graphviz-${version}"
          gh pr create --repo bazelbuild/bazel-central-registry --base main --head "filmil:graphviz-${version}" \
            --title "graphviz ${version}" \
            --body "Overlay module for graphviz, upstream source archive from gitlab.com/graphviz/graphviz. Maintained at https://github.com/filmil/bazel_graphviz."
