name: Tag and Release

on:
  schedule:
    - cron: '0 0 1 1,7 *'
  workflow_dispatch:
    inputs:
      force_release:
        description: >-
          Release even when no commit asks for a version bump. Use this when a
          change landed with a commit message that conventional-commit parsing
          does not recognise, so the tree is ahead of the last tag but nothing
          triggers a bump.
        type: boolean
        default: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - name: Setup bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Checkout
        uses: actions/checkout@v3
      - name: "Test"
        run: "bazel test --test_output=errors //..."
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          # The guards below already skip the release and the publication when
          # `new_tag` is empty, but the action never left it empty: it bumps the
          # patch version on every run, even with no new commit. v0.0.47 and
          # v0.0.48 hold the same tree for that reason. `false` makes the action
          # emit an empty `new_tag` when no commit asks for a release, which
          # finally lets the existing guards do their work.
          # Normally `false`, so the action emits an empty `new_tag` when no
          # commit asks for a release and the guards below skip everything.
          # The Run workflow button can override that with `force_release`,
          # which bumps the patch version regardless. That is the escape hatch
          # for a commit whose message conventional-commit parsing does not
          # recognise: the code is on main, but nothing asks for a version.
          default_bump: ${{ inputs.force_release && 'patch' || 'false' }}
      - name: Create a GitHub release
        if: steps.tag_version.outputs.new_tag != ''
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          generateReleaseNotes: true
      - name: Get release tag
        if: steps.tag_version.outputs.new_tag != ''
        id: get_version
        run: echo "VERSION=${{ steps.tag_version.outputs.new_tag }}" >> $GITHUB_ENV
      - name: Get repo name
        if: steps.tag_version.outputs.new_tag != ''
        id: get_repo_name
        run: echo "REPO_NAME=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV
      - name: "Publish source archive"
        if: steps.tag_version.outputs.new_tag != ''
        uses: thedoctor0/zip-release@0.7.5
        with:
          type: 'zip'
          filename: "${{ env.REPO_NAME }}-${{ env.VERSION }}.zip"
          exclusions: '*.git* /*node_modules/* .editorconfig /bazel-*'
      - name: "Upload source archive"
        if: steps.tag_version.outputs.new_tag != ''
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          allowUpdates: true
          artifacts: "${{ env.REPO_NAME }}-${{ env.VERSION }}.zip"

  publish:
    needs: tag
    if: needs.tag.outputs.new_tag != ''
    uses: ./.github/workflows/publish.yml
    with:
      tag_name: ${{ needs.tag.outputs.new_tag }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets: inherit
